# dsh-educoder 的 bundle 补丁层：把工具行插入 profile 的插件树。
# config 可以在 ~/.dsh/profiles/desktop/cordis.patch.yml 里按 id 覆盖（整段替换）。
#
# home = edu CLI（edu.mjs）所在目录；换目录时只改这里。
# nodeBin = 用来跑 CLI 的 node（DSH 主进程是 Electron，不能直接当 node 用）。

- insert:
    - id: tool-educoder
      name: 'dsh-educoder'
      config:
        home: '/Users/Lenovo/Documents/dsh-educoder/cli'
        nodeBin: '/Users/Lenovo/.dsh/dsh-runtimes/dsh-primary-runtime/dependencies/node/bin/node'
        timeoutMs: 180000
        submitTimeoutMs: 600000
